name: Update sitemap

on:
  push:
    branches: [main]
    paths-ignore:
      - 'sitemap.xml'
      - 'sitemap-*.xml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitemap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sitemap:
    runs-on: ubuntu-latest
    # Don't retrigger on the bot's own commit.
    if: "!contains(github.event.head_commit.message, '[sitemap]')"

    steps:
      - name: Checkout (full history for accurate <lastmod>)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # Runs first: every canonical / og:url / schema URL is put on one host
      # BEFORE the sitemap is built, so the two can never disagree.
      - name: Normalize canonical host
        run: node scripts/normalize-domain.mjs

      - name: Generate sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[sitemap] regenerate ($(grep -c '<loc>' sitemap.xml) URLs) + normalize host"
          git push
