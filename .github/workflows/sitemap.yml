name: Update sitemap

on:
  push:
    branches: [main]
    paths-ignore:
      - 'sitemap.xml'
      - 'sitemap-*.xml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitemap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sitemap:
    runs-on: ubuntu-latest
    # Don't retrigger on the bot's own sitemap commit.
    if: "!contains(github.event.head_commit.message, '[sitemap]')"

    steps:
      - name: Checkout (full history for accurate <lastmod>)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- 'sitemap*.xml')" ]; then
            echo "Sitemap unchanged — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap*.xml
          git commit -m "[sitemap] regenerate ($(grep -c '<loc>' sitemap.xml) URLs)"
          git push

      - name: Ping search engines
        if: success()
        continue-on-error: true
        run: |
          curl -sS -o /dev/null -w "IndexNow: %{http_code}\n" \
            "https://www.bing.com/indexnow?url=https://www.multicalci.com/&key=${{ secrets.INDEXNOW_KEY }}" || true
