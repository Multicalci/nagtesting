<style>
:root {

* { box-sizing: border-box; }

col.c-sg { width: 15%; } col.c-s, col.c-l { width: 46px; } col.c-r { width: 82px; } col.c-r2 { width: 92px; } col.c-act { width: 94px; }

td.after select.sl { width: auto; display: inline-block; margin-left: 2px; }
td.after .risk { display: block; margin-top: 2px; }
.icon-btn { width: 26px; height: 26px; display: inline-grid; place-items: center; border: 1px solid transparent; background: none; border-radius: 4px; cursor: pointer; color: var(--muted); }
.icon-btn:hover { background: var(--paper); border-color: var(--rule-soft); color: var(--ink); }
.icon-btn svg { width: 15px; height: 15px; }

tr.na .cell { color: var(--muted); font-style: italic; }

/* ---------- recommendations & matrix ---------- */
table.rr { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 900px; }
table.rr th { text-align: left; font-weight: 600; color: var(--muted); font-size: 13px; padding: 8px; border-bottom: 1px solid var(--rule); background: #f7f9fa; }

.pad { padding: 18px; }

.legend dl { margin: 0 0 14px; display: grid; grid-template-columns: 26px 1fr; gap: 3px 8px; font-size: 13px; }
.legend dt { font-weight: 600; }
.legend dd { margin: 0; color: var(--muted); }
.legend h3 { font-size: 14px; margin: 0 0 6px; }
.note { font-size: 12.5px; color: var(--muted); max-width: 70ch; }

/* ---------- empty state ---------- */
.welcome { max-width: 760px; margin: 36px auto; background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 30px 34px; }
.welcome h1 { font-size: 26px; margin: 0 0 8px; font-weight: 600; line-height: 1.2; }

.syms { display: flex; gap: 18px; color: var(--line); margin: 6px 0 22px; flex-wrap: wrap; }
.syms svg { width: 46px; height: 46px; }

.steps li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: baseline; }
.steps li::before { content: counter(s); display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); color: var(--line); font-size: 12px; font-weight: 700; }

.dialog header { padding: 18px 22px 6px; }

.dialog .body { padding: 6px 22px 10px; }

.step { margin: 14px 0 6px; }
.step h3 { display: flex; align-items: center; gap: 9px; font-size: 15px; margin: 0 0 10px; font-weight: 600; }

.eq { text-align: left; border: 1px solid var(--rule); background: #fff; border-radius: 5px; padding: 10px; cursor: pointer; display: grid; gap: 4px; }

.fgroups { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 6px 18px; }
.fgroup h4 { font-size: 13px; margin: 8px 0 4px; font-weight: 600; }
.fgroup label { display: grid; grid-template-columns: 18px 1fr; gap: 6px; font-size: 13px; line-height: 1.3; padding: 3px 0; cursor: pointer; }
.fgroup input { margin: 1px 0 0; accent-color: var(--line); }
.err { color: var(--r4); font-size: 13px; min-height: 18px; }

/* ---------- popover & toast ---------- */
.pop { position: absolute; z-index: 60; background: #fff; border: 1px solid var(--rule); border-radius: 6px; box-shadow: 0 12px 30px rgba(23, 36, 46, 0.2); width: 440px; max-height: 380px; overflow-y: auto; padding: 6px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

}

    });
    var noteRow = 6 + state.nodes.length;
    bs.getCell(noteRow, 2).value = "Draft prepared with the multicalci.com HAZOP worksheet (library version " + L.version + "). Cause frequencies are typical generic values; the HAZOP team is to confirm all entries.";
    bs.getCell(noteRow, 2).font = { name: "Arial", size: 9, italic: true };
    return wb;
  }
  function exportExcel() {
    if (!state.nodes.length) { toast("Add a node before exporting."); return; }
    toast("Preparing the Excel file...");
    loadExcelJS().then(function (ExcelJS) {
      return buildWorkbook(ExcelJS).xlsx.writeBuffer();
    }).then(function (buf) {
      download(new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }), "HAZOP_" + fileSafe(state.study.title) + ".xlsx");
      toast("Excel file downloaded.");
    }).catch(function () { toast("The Excel export needs an internet connection to load. Check your connection and try again."); });
  }

  /* ---------------- example ---------------- */
  function loadExample(btn) {
    var a = { id: uid(), name: "P-101 A/B naphtha transfer pumps from T-101 to column feed", intent: "Transfer 40 m3/h naphtha at 8 barg to column C-201 feed", eq: "pump",
      fluids: ["flammable"], phase: "liquid", feats: ["standby", "strainer", "pi", "fic", "nrv", "drains", "sop"], rows: [] };
    var b = { id: uid(), name: "T-101 naphtha day tank", intent: "Store naphtha at atmospheric pressure, 500 m3 working volume", eq: "tank",
      fluids: ["flammable", "env"], phase: "liquid", feats: ["lg", "lic", "lah", "pvrv", "dike", "sop"], rows: [] };
    if (btn) busy(btn, "Opening...");
    Promise.all([buildRows(a), buildRows(b)]).then(function (r) {
      a.rows = r[0]; b.rows = r[1];
      state = blank(); state.study.title = "Naphtha transfer system (example)"; state.study.ref = "P&ID 101-PR-001";
      state.nodes = [b, a]; state.cur = b.id; ui.tab = "ws";
      renderAll(); toast("Example study opened. Edit anything, or start your own with New.");
    }, function (e) { if (btn) busy(btn, null); toast(e.message); });
  }

  /* ---------------- start ---------------- */
  function loading(msg, retry) {
    renderBar();
    $("#rail").innerHTML = "";
    $("#main").innerHTML = '<div class="welcome"><p>' + esc(msg) + "</p>" + (retry ? '<button class="btn primary" id="retryMeta">Try again</button>' : "") + "</div>";
    if (retry) $("#retryMeta").addEventListener("click", start);
  }
  function start() {
    var cached = null;
    try { cached = JSON.parse(localStorage.getItem(META_KEY) || "null"); } catch (e) { cached = null; }
    if (cached && cached.EQ) { setMeta(cached); renderAll(); } else loading("Loading the HAZOP library...");
    api("meta").then(function (m) {
      try { localStorage.setItem(META_KEY, JSON.stringify(m)); } catch (e) { /* storage unavailable */ }
      var changed = !cached || cached.version !== m.version || JSON.stringify(cached) !== JSON.stringify(m);
      setMeta(m); if (changed) renderAll();
    }, function (e) {
      if (!cached) loading(e.message, true);
      else toast("Working offline: you can edit and export this study, but building new rows needs a connection.");
    });
  }
  bind();
  start();
  window.HZAPP = { state: function () { return state; } };
})();

</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
