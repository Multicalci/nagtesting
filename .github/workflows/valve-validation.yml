# .github/workflows/valve-validation.yml
# Runs the control-valve validation/regression suite after every Vercel deploy:
# production on https://www.multicalci.com; a preview on its own URL when the
# Vercel "Protection Bypass for Automation" secret (VERCEL_AUTOMATION_BYPASS_SECRET)
# is set as a repository secret, otherwise the preview run is skipped.

name: Valve sizing validation

on:
  deployment_status:

jobs:
  validate:
    # only run once Vercel reports the deploy succeeded and is reachable
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Production deployments are checked on the public domain (not behind Deployment Protection).
      # Preview URLs need the bypass secret; without it the preview run is skipped with a notice
      # instead of failing on HTTP 401.
      - name: Run control-valve validation suite
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          DEPLOY_ENV: ${{ github.event.deployment.environment }}
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
        run: |
          case "$DEPLOY_ENV" in
            Production*) URL="https://www.multicalci.com" ;;
            *)           URL="$TARGET_URL" ;;
          esac
          if [ "$URL" != "https://www.multicalci.com" ] && [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::notice::Preview deployment is behind Vercel Deployment Protection and VERCEL_AUTOMATION_BYPASS_SECRET is not set - preview run skipped. Production deployments are validated on https://www.multicalci.com."
            exit 0
          fi
          node .github/tests/validate.mjs "$URL"
